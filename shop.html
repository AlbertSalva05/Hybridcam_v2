<body data-page="shop">
<a class="u-visually-hidden" href="#main">Skip to content</a>
<div data-partial="header"></div>

<main id="main">
<section class="l-section l-section--end">
  <div class="l-wrap">
    <div class="section-head">
      <p class="eyebrow">Cleared inventory · Metro Manila</p>
      <h1 class="section-head__title" data-shop-title>Every unit has a paper trail.</h1>
      <p class="section-head__lede">Serial, shutter count and the rider's inspection clip stay attached to the order forever, yours to show the next buyer.</p>
    </div>

    <form class="filter-panel" data-filters role="search" aria-label="Filter inventory" onsubmit="return false">
      <div class="filter-panel__search field">
        <label class="field__label" for="f-q">Search units</label>
        <span class="filter-panel__box">
          <span class="filter-panel__glass" aria-hidden="true"></span>
          <input class="field__control" id="f-q" type="search" data-filter-q placeholder="Try “X-S10”, “digicam”, “Cubao”…" />
        </span>
      </div>

      <div class="filter-bar" role="group" aria-label="Category">
        <button class="filter-bar__chip filter-bar__chip--active" type="button" data-filter-chip="all" aria-pressed="true">All categories</button>
        <button class="filter-bar__chip" type="button" data-filter-chip="mirrorless" aria-pressed="false">Mirrorless</button>
        <button class="filter-bar__chip" type="button" data-filter-chip="digicam" aria-pressed="false">Digicams</button>
        <button class="filter-bar__chip" type="button" data-filter-chip="glass" aria-pressed="false">Lenses &amp; glass</button>
      </div>

      <div class="filter-panel__grid">
        <p class="field">
          <label class="field__label" for="f-brand">Brand</label>
          <select class="field__select" id="f-brand" data-filter-brand>
            <option value="all">All brands</option>
            <option value="Canon">Canon</option>
            <option value="Fujifilm">Fujifilm</option>
            <option value="Sony">Sony</option>
            <option value="Nikon">Nikon</option>
            <option value="Sigma">Sigma</option>
          </select>
        </p>
        <p class="field">
          <label class="field__label" for="f-price">Price</label>
          <select class="field__select" id="f-price" data-filter-price>
            <option value="all">Any price</option>
            <option value="u10">Under ₱10,000</option>
            <option value="10-30">₱10,000 – ₱30,000</option>
            <option value="30-50">₱30,000 – ₱50,000</option>
            <option value="o50">Over ₱50,000</option>
          </select>
        </p>
        <p class="field">
          <label class="field__label" for="f-grade">Condition</label>
          <select class="field__select" id="f-grade" data-filter-grade>
            <option value="all">Any condition</option>
            <option value="mint">Mint</option>
            <option value="like-new">Like new</option>
            <option value="good">Good</option>
          </select>
        </p>
        <p class="field">
          <label class="field__label" for="f-sort">Sort</label>
          <select class="field__select" id="f-sort" data-filter-sort>
            <option value="featured">Featured</option>
            <option value="low">Price · low to high</option>
            <option value="high">Price · high to low</option>
            <option value="name">Name · A to Z</option>
          </select>
        </p>
      </div>

      <div class="filter-panel__foot">
        <span class="filter-panel__count" data-filter-count aria-live="polite"></span>
        <button class="btn btn--quiet btn--sm" type="button" data-filter-clear>Clear filters</button>
      </div>
    </form>

    <h2 class="section-head__title u-mt-5" style="font-size:clamp(22px,2.4vw,30px)" id="results">Available units</h2>
    <div class="l-grid l-grid--quarter u-mt-4" data-products id="grid" aria-labelledby="results"></div>
  </div>
</section>
</main>

<div data-partial="footer"></div>

    <h2 class="modal__title" id="pmodal-title" data-pmodal-title></h2>
    <p class="modal__lede" data-pmodal-lede></p>
    <div data-pmodal-canvas></div>
  </div>
</div>
